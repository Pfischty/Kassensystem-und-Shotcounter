{% extends "base.html" %}
{% block title %}Shotcounter Vollbild{% endblock %}
{% block header %}{% endblock %}
{% block content %}
<style>
  /* Vollbilddarstellung mit eigenem Look */
  header { display: none; }
  body, html { height: 100%; }
  .container { padding: 0; }
  .leaderboard-hero {
    --cards-visible: {{ limit }};
    --lb-background: {{ shot_settings.background_color }};
    --lb-card: {{ shot_settings.primary_color }};
    --lb-secondary: {{ shot_settings.secondary_color }};
    --lb-tertiary: {{ shot_settings.tertiary_color }};
    --lb-title-size: {{ shot_settings.title_size }}rem;
    --lb-team-size: {{ shot_settings.team_size }}rem;
    --header-space: 140px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    {% if shot_settings.background_image %}
    background: var(--lb-background) url('{{ url_for('uploaded_file', filename=shot_settings.background_image|e) }}') center/cover no-repeat;
    position: relative;
    {% else %}
    background: var(--lb-background);
    background:
      radial-gradient(circle at 20% 20%, color-mix(in srgb, var(--lb-secondary) 20%, transparent), transparent 28%),
      radial-gradient(circle at 80% 0%, color-mix(in srgb, var(--lb-tertiary) 20%, transparent), transparent 25%),
      linear-gradient(135deg, var(--lb-background) 0%, #0f172a 60%, var(--lb-background) 100%);
    {% endif %}
    padding: 2rem 2.5rem 2.5rem;
    box-sizing: border-box;
  }
  {% if shot_settings.background_image %}
  /* Add overlay for better text readability when using background image */
  .leaderboard-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(11, 18, 34, 0.4), rgba(15, 23, 42, 0.55));
    z-index: 0;
  }
  .leaderboard-head, .leaderboard-grid {
    position: relative;
    z-index: 1;
  }
  .leaderboard-hero.has-bg .lb-card {
    background: transparent;
    border: none;
    box-shadow: none;
  }
  .leaderboard-hero.has-bg .lb-rank:not(.lb-rank--1):not(.lb-rank--2):not(.lb-rank--3) {
    background: var(--lb-card);
  }
  {% endif %}
  .leaderboard-head {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1.2rem;
    text-align: center;
  }
  .leaderboard-event {
    font-size: clamp(calc(var(--lb-title-size) * 0.85), calc(var(--lb-title-size) + 0.6vw), calc(var(--lb-title-size) * 1.1));
    font-weight: 800;
  }
  .leaderboard-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.75rem;
    flex: 1;
  }
  .lb-card {
    background: var(--lb-card);
    border: 1px solid rgba(255,255,255,0.08);
    border: 1px solid color-mix(in srgb, var(--lb-card) 70%, #ffffff 12%);
    border-radius: 16px;
    padding: 0.75rem 1rem;
    display: grid;
    grid-template-columns: 88px 1fr;
    align-items: stretch;
    gap: 1.2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    min-height: calc((100vh - var(--header-space)) / var(--cards-visible));
  }
  .lb-rank {
    width: 88px;
    height: 100%;
    min-height: 100%;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: calc(var(--lb-team-size) * 0.95);
    color: #0b1222;
    background: var(--lb-card);
  }
  .lb-rank--1 {
    background: linear-gradient(135deg, #f5d76e, #d4af37);
  }
  .lb-rank--2 {
    background: linear-gradient(135deg, #e5e7eb, #c0c0c0);
  }
  .lb-rank--3 {
    background: linear-gradient(135deg, #d9a066, #cd7f32);
  }
  .lb-info {
    flex: 1;
    display: flex;
    align-items: center;
  }
  .leaderboard-hero.layout-inline .lb-info {
    justify-content: flex-start;
  }
  .leaderboard-hero.layout-inline .lb-info > div {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 0.6rem;
    text-align: left;
  }
  .lb-name {
    margin: 0;
    font-size: var(--lb-team-size);
    font-weight: 900;
    letter-spacing: 0.2px;
  }
  .lb-shots {
    margin: 0.2rem 0 0;
    font-size: calc(var(--lb-team-size) * 0.6);
    color: rgba(226,232,240,0.75);
    font-weight: 600;
  }
  .leaderboard-hero.layout-inline .lb-shots {
    margin: 0;
    font-size: var(--lb-team-size);
    color: inherit;
  }
  .leaderboard-hero.layout-inline .lb-shots::before {
    content: "– ";
  }
  .lb-empty {
    color: rgba(226,232,240,0.65);
    font-size: 1.1rem;
  }
  @media (max-width: 720px) {
    .leaderboard-hero { padding: 1.2rem; --header-space: 110px; }
    .leaderboard-head { flex-direction: column; }
    .leaderboard-grid { grid-template-columns: 1fr; }
  }

  /* Highlight + Platzwechsel im Leaderboard */
  .lb-card { will-change: transform; }
  .lb-card--flash {
    animation: lb-row-flash 1.6s ease-out;
  }
  @keyframes lb-row-flash {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--lb-tertiary) 90%, transparent), 0 10px 30px rgba(0,0,0,0.35); transform: scale(1.03); }
    40% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--lb-tertiary) 35%, transparent), 0 10px 30px rgba(0,0,0,0.35); }
    100% { box-shadow: 0 0 0 0 transparent, 0 10px 30px rgba(0,0,0,0.35); transform: scale(1); }
  }

  /* Willkommens- und Buchungs-Animation */
  .lb-celebration {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: radial-gradient(circle at center, rgba(15, 23, 42, 0.78), rgba(2, 4, 10, 0.92));
    backdrop-filter: blur(4px);
  }
  .lb-celebration.show {
    display: flex;
    animation: lb-fade-in 0.25s ease-out;
  }
  .lb-celebration.hide {
    animation: lb-fade-out 0.4s ease-in forwards;
  }
  .lb-rays {
    position: absolute;
    width: 160vmax;
    height: 160vmax;
    left: 50%;
    top: 50%;
    margin: -80vmax 0 0 -80vmax;
    background: repeating-conic-gradient(
      from 0deg,
      color-mix(in srgb, var(--accent) 22%, transparent) 0deg 6deg,
      transparent 6deg 18deg
    );
    -webkit-mask-image: radial-gradient(circle, black 0%, transparent 60%);
    mask-image: radial-gradient(circle, black 0%, transparent 60%);
    animation: lb-spin 18s linear infinite;
    opacity: 0.9;
  }
  .lb-confetti {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 2;
  }
  .lb-celebration-card {
    --accent: var(--lb-secondary, #38bdf8);
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2.5rem 4.5rem 2.8rem;
    max-width: 88vw;
    border-radius: 28px;
    background: linear-gradient(160deg, color-mix(in srgb, var(--lb-card, #1e293b) 92%, var(--accent) 8%), #0b1222);
    border: 2px solid color-mix(in srgb, var(--accent) 70%, white 10%);
    box-shadow:
      0 0 60px color-mix(in srgb, var(--accent) 45%, transparent),
      0 25px 80px rgba(0,0,0,0.6);
    animation: lb-pop-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .lb-celebration { --accent: var(--lb-secondary, #38bdf8); }
  .lb-celebration.is-booking,
  .lb-celebration.is-booking .lb-celebration-card { --accent: var(--lb-tertiary, #34d399); }
  .lb-celebration-kicker {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 0.6rem;
  }
  .lb-celebration-name {
    font-size: clamp(2.8rem, 8vw, 6rem);
    font-weight: 900;
    line-height: 1.05;
    margin: 0;
    color: #f8fafc;
    text-shadow: 0 0 30px color-mix(in srgb, var(--accent) 55%, transparent), 0 4px 20px rgba(0,0,0,0.5);
  }
  .lb-letter {
    display: inline-block;
    opacity: 0;
    animation: lb-letter-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .lb-celebration-sub {
    margin: 1rem 0 0;
    font-size: 1.8rem;
    font-weight: 700;
    color: rgba(226,232,240,0.9);
    opacity: 0;
    animation: lb-rise-in 0.5s ease-out forwards;
  }
  .lb-booking-row {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 1.6rem;
    margin-top: 1.2rem;
  }
  .lb-celebration.is-booking .lb-booking-row { display: flex; }
  .lb-glass { width: clamp(70px, 9vw, 120px); height: auto; overflow: visible; }
  .lb-glass-liquid {
    transform-box: fill-box;
    transform-origin: bottom;
    transform: scaleY(0);
    fill: var(--accent);
  }
  .lb-celebration.is-booking.show .lb-glass-liquid {
    animation: lb-fill var(--count-ms, 1200ms) cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .lb-amount {
    font-size: clamp(4rem, 12vw, 9rem);
    font-weight: 900;
    line-height: 1;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 40px color-mix(in srgb, var(--accent) 60%, transparent);
  }
  .lb-amount.bump { animation: lb-bump 0.35s ease-out; }
  .lb-rank-badge {
    display: inline-block;
    margin-top: 1.2rem;
    padding: 0.55rem 1.4rem;
    border-radius: 999px;
    font-size: 1.7rem;
    font-weight: 900;
    color: #0b1222;
    background: linear-gradient(135deg, #f5d76e, #d4af37);
    box-shadow: 0 0 30px rgba(245, 215, 110, 0.55);
    opacity: 0;
  }
  .lb-rank-badge.visible {
    animation: lb-badge-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .lb-rank-badge[hidden] { display: none; }
  /* Gewichtung: Strahlen nur bei grossen Momenten (ab 10 Shots, neues Team) */
  .lb-rays { display: none; }
  .lb-celebration.with-rays .lb-rays { display: block; }

  /* Klein (< 5 Shots): kompaktes Banner unten, Leaderboard bleibt sichtbar */
  .lb-celebration.tier-small {
    align-items: flex-end;
    padding-bottom: 6vh;
    background: linear-gradient(to top, rgba(2, 4, 10, 0.88), rgba(2, 4, 10, 0.35) 45%, transparent 75%);
    backdrop-filter: none;
  }
  .lb-celebration.tier-small .lb-celebration-card {
    padding: 1.1rem 2.8rem 1.3rem;
    animation: lb-slide-up 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .lb-celebration.tier-small .lb-celebration-kicker { font-size: 1.05rem; margin-bottom: 0.3rem; }
  .lb-celebration.tier-small .lb-celebration-name { font-size: clamp(2rem, 5vw, 3.4rem); }
  .lb-celebration.tier-small .lb-booking-row { margin-top: 0.4rem; gap: 1rem; }
  .lb-celebration.tier-small .lb-glass { width: clamp(42px, 5vw, 60px); }
  .lb-celebration.tier-small .lb-amount { font-size: clamp(2.6rem, 7vw, 4.4rem); }
  .lb-celebration.tier-small .lb-celebration-sub { font-size: 1.2rem; margin-top: 0.4rem; }
  .lb-celebration.tier-small .lb-rank-badge { font-size: 1.2rem; margin-top: 0.6rem; }

  /* Gross (ab 10 Shots): Karte wackelt */
  .lb-celebration.tier-big .lb-celebration-card {
    animation: lb-pop-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), lb-shake 0.5s 0.6s ease-in-out 2;
  }

  /* Podest: Medaillenfarbe, Medaille fällt rein, Glanz läuft über die Karte */
  .lb-celebration.is-booking.podium-1, .lb-celebration.is-booking.podium-1 .lb-celebration-card { --accent: #f5d76e; }
  .lb-celebration.is-booking.podium-2, .lb-celebration.is-booking.podium-2 .lb-celebration-card { --accent: #e5e7eb; }
  .lb-celebration.is-booking.podium-3, .lb-celebration.is-booking.podium-3 .lb-celebration-card { --accent: #e0a96d; }
  .lb-celebration.is-podium .lb-celebration-card {
    overflow: hidden;
    border-width: 3px;
    padding-top: 1.8rem;
    box-shadow:
      0 0 120px color-mix(in srgb, var(--accent) 70%, transparent),
      0 25px 80px rgba(0,0,0,0.6);
  }
  .lb-celebration.is-podium .lb-celebration-card::after {
    content: "";
    position: absolute;
    inset: -50%;
    background: linear-gradient(115deg, transparent 42%, rgba(255,255,255,0.38) 50%, transparent 58%);
    transform: translateX(-60%);
    animation: lb-shine 1.4s 0.5s ease-in-out 2;
    pointer-events: none;
  }
  .lb-medal {
    display: none;
    font-size: clamp(4.5rem, 11vw, 8rem);
    line-height: 1;
    margin-bottom: 0.4rem;
    filter: drop-shadow(0 0 25px color-mix(in srgb, var(--accent) 80%, transparent));
  }
  .lb-celebration.is-podium .lb-medal {
    display: block;
    animation: lb-medal-drop 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .lb-celebration.podium-1 .lb-celebration-name { font-size: clamp(3.4rem, 10vw, 7.5rem); }
  .lb-celebration.podium-1 .lb-celebration-card {
    animation: lb-pop-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), lb-pulse-glow 1.2s 0.6s ease-in-out 3;
  }
  .lb-flash {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, rgba(255, 244, 200, 0.85), transparent 70%);
    opacity: 0;
    pointer-events: none;
    z-index: 3;
  }
  .lb-celebration.podium-1.show .lb-flash { animation: lb-flash 0.9s ease-out; }
  @keyframes lb-fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes lb-fade-out { from { opacity: 1; } to { opacity: 0; } }
  @keyframes lb-spin { to { transform: rotate(360deg); } }
  @keyframes lb-pop-in {
    0% { transform: scale(0.5) rotate(-4deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  @keyframes lb-letter-in {
    0% { opacity: 0; transform: translateY(0.6em) scale(0.6); filter: blur(6px); }
    100% { opacity: 1; transform: none; filter: none; }
  }
  @keyframes lb-rise-in {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes lb-fill { to { transform: scaleY(1); } }
  @keyframes lb-bump {
    0% { transform: scale(1); }
    40% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  @keyframes lb-badge-in {
    0% { opacity: 0; transform: scale(0.4) translateY(10px); }
    100% { opacity: 1; transform: none; }
  }
  @keyframes lb-slide-up {
    from { opacity: 0; transform: translateY(60px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes lb-shine {
    from { transform: translateX(-60%); }
    to { transform: translateX(60%); }
  }
  @keyframes lb-medal-drop {
    0% { opacity: 0; transform: translateY(-120px) rotate(-25deg) scale(0.6); }
    70% { opacity: 1; transform: translateY(8px) rotate(6deg) scale(1.08); }
    100% { opacity: 1; transform: none; }
  }
  @keyframes lb-pulse-glow {
    0%, 100% { box-shadow: 0 0 120px color-mix(in srgb, var(--accent) 70%, transparent), 0 25px 80px rgba(0,0,0,0.6); }
    50% { box-shadow: 0 0 200px color-mix(in srgb, var(--accent) 95%, transparent), 0 25px 80px rgba(0,0,0,0.6); }
  }
  @keyframes lb-flash {
    0% { opacity: 0; }
    20% { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes lb-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px) rotate(-1deg); }
    75% { transform: translateX(8px) rotate(1deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .lb-rays, .lb-letter, .lb-celebration-card, .lb-medal { animation: none !important; opacity: 1; }
    .lb-celebration-card::after, .lb-flash { display: none; }
  }
</style>

<div class="leaderboard-hero layout-{{ shot_settings.leaderboard_layout }} {% if shot_settings.background_image %}has-bg{% endif %}" data-refresh-url="{{ url_for('shotcounter_leaderboard_data', limit=limit) }}" data-events-url="{{ url_for('shotcounter_leaderboard_events') }}" data-last-event-id="{{ last_event_id }}">
  <div class="leaderboard-head">
    <div class="leaderboard-event">Shotcounter - {{ event.name }}</div>
  </div>

  <div id="leaderboard-grid" class="leaderboard-grid"></div>
</div>

<div class="lb-celebration" id="lb-celebration">
  <div class="lb-rays"></div>
  <canvas class="lb-confetti" id="lb-confetti"></canvas>
  <div class="lb-flash"></div>
  <div class="lb-celebration-card">
    <div class="lb-medal" id="lb-medal" aria-hidden="true"></div>
    <p class="lb-celebration-kicker" id="lb-celebration-kicker"></p>
    <p class="lb-celebration-name" id="lb-celebration-name"></p>
    <div class="lb-booking-row">
      <svg class="lb-glass" viewBox="0 0 60 80" aria-hidden="true">
        <defs>
          <clipPath id="lb-glass-clip"><path d="M8 6 L52 6 L46 74 L14 74 Z"/></clipPath>
        </defs>
        <rect class="lb-glass-liquid" x="0" y="16" width="60" height="60" clip-path="url(#lb-glass-clip)"/>
        <path d="M8 6 L52 6 L46 74 L14 74 Z" fill="none" stroke="rgba(248,250,252,0.85)" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M16 14 L18 64" stroke="rgba(255,255,255,0.35)" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <span class="lb-amount" id="lb-amount">+0</span>
    </div>
    <p class="lb-celebration-sub" id="lb-celebration-sub"></p>
    <div class="lb-rank-badge" id="lb-rank-badge" hidden></div>
  </div>
</div>

<script>
  const heroEl = document.querySelector(".leaderboard-hero");
  const refreshUrl = heroEl.dataset.refreshUrl;
  const gridEl = document.getElementById("leaderboard-grid");
  const fallbackTeams = {{ teams | tojson }};
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const escapeHtml = (value) =>
    String(value).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);

  // Rendert die Liste neu und lässt Teams, die den Platz gewechselt haben,
  // sanft an ihre neue Position gleiten (FLIP: alte Position merken,
  // neu zeichnen, Differenz per transform zurückspielen).
  const renderTeams = (teams) => {
    const oldTops = new Map();
    gridEl.querySelectorAll("[data-team-id]").forEach((el) => {
      oldTops.set(el.dataset.teamId, el.getBoundingClientRect().top);
    });

    if (!teams.length) {
      gridEl.innerHTML = '<div class="lb-card"><div class="lb-empty">Keine Teams vorhanden.</div></div>';
      return;
    }
    gridEl.innerHTML = teams.map((team, idx) => `
        <div class="lb-card" data-team-id="${team.id}">
          <div class="lb-rank lb-rank--${idx + 1}">#${idx + 1}</div>
          <div class="lb-info">
            <div>
              <p class="lb-name">${escapeHtml(team.name)}</p>
              <p class="lb-shots">${team.shots} Shots</p>
            </div>
          </div>
        </div>
      `).join("");

    if (reduceMotion || !oldTops.size) return;
    gridEl.querySelectorAll("[data-team-id]").forEach((el) => {
      const oldTop = oldTops.get(el.dataset.teamId);
      const delta = oldTop === undefined ? 0 : oldTop - el.getBoundingClientRect().top;
      if (Math.abs(delta) < 2) return;
      el.animate(
        [{ transform: `translateY(${delta}px)` }, { transform: "translateY(0)" }],
        { duration: 900, easing: "cubic-bezier(0.22, 1, 0.36, 1)" }
      );
    });
  };

  const fetchAndRender = async () => {
    try {
      const res = await fetch(refreshUrl, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      renderTeams(data.teams || []);
    } catch (err) {
      console.error("Leaderboard Refresh fehlgeschlagen", err);
    }
  };

  const flashTeamRow = (teamId) => {
    const row = gridEl.querySelector(`[data-team-id="${teamId}"]`);
    if (!row) return;
    row.classList.remove("lb-card--flash");
    void row.offsetWidth; // Animation neu starten
    row.classList.add("lb-card--flash");
  };

  renderTeams(fallbackTeams);
  fetchAndRender();
  setInterval(fetchAndRender, 5000);

  // --- Konfetti (eigenes Canvas, kein CDN - der Pi ist am Event evtl. offline) ---
  const confettiCanvas = document.getElementById("lb-confetti");
  const confettiCtx = confettiCanvas.getContext("2d");
  let confettiParticles = [];
  let confettiRunning = false;

  function confettiColors() {
    const css = getComputedStyle(heroEl);
    return [
      css.getPropertyValue("--lb-secondary").trim() || "#38bdf8",
      css.getPropertyValue("--lb-tertiary").trim() || "#34d399",
      "#f5d76e",
      "#f8fafc",
      "#f472b6",
    ];
  }

  // mode "cannons": zwei Kanonen unten links/rechts; "rain": Regen von oben (Platz 1)
  function burstConfetti(count, { colors = confettiColors(), mode = "cannons" } = {}) {
    if (reduceMotion) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    confettiCanvas.width = window.innerWidth * dpr;
    confettiCanvas.height = window.innerHeight * dpr;
    confettiCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const w = window.innerWidth;
    const h = window.innerHeight;
    for (let i = 0; i < count; i++) {
      const base = {
        size: 7 + Math.random() * 8,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.35,
        color: colors[i % colors.length],
        life: 0,
      };
      if (mode === "rain") {
        confettiParticles.push({
          ...base,
          x: Math.random() * w,
          y: -20 - Math.random() * h * 0.6,
          vx: (Math.random() - 0.5) * 2,
          vy: 2 + Math.random() * 3,
          g: 0.06,
        });
        continue;
      }
      const fromLeft = i % 2 === 0;
      const angle = (fromLeft ? -60 : -120) + (Math.random() - 0.5) * 40;
      const speed = 13 + Math.random() * 11;
      confettiParticles.push({
        ...base,
        x: fromLeft ? w * 0.08 : w * 0.92,
        y: h * 0.95,
        vx: Math.cos((angle * Math.PI) / 180) * speed,
        vy: Math.sin((angle * Math.PI) / 180) * speed,
        g: 0.32,
      });
    }
    if (!confettiRunning) {
      confettiRunning = true;
      requestAnimationFrame(stepConfetti);
    }
  }

  function stepConfetti() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    confettiCtx.clearRect(0, 0, w, h);
    confettiParticles = confettiParticles.filter((p) => p.y < h + 40 && p.life < 480);
    confettiParticles.forEach((p) => {
      p.life += 1;
      p.vy += p.g;
      p.vx *= 0.985;
      p.vy *= 0.985;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      confettiCtx.save();
      confettiCtx.translate(p.x, p.y);
      confettiCtx.rotate(p.rot);
      confettiCtx.scale(1, Math.cos(p.life * 0.15)); // "Flattern"
      confettiCtx.fillStyle = p.color;
      confettiCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      confettiCtx.restore();
    });
    if (confettiParticles.length) {
      requestAnimationFrame(stepConfetti);
    } else {
      confettiRunning = false;
      confettiCtx.clearRect(0, 0, w, h);
    }
  }

  // --- Willkommens-/Buchungs-Animation ---
  const eventsUrl = heroEl.dataset.eventsUrl;
  let lastEventId = parseInt(heroEl.dataset.lastEventId, 10) || 0;

  const celebrationEl = document.getElementById("lb-celebration");
  const celebrationKicker = document.getElementById("lb-celebration-kicker");
  const celebrationName = document.getElementById("lb-celebration-name");
  const celebrationSub = document.getElementById("lb-celebration-sub");
  const amountEl = document.getElementById("lb-amount");
  const rankBadge = document.getElementById("lb-rank-badge");
  const medalEl = document.getElementById("lb-medal");
  const CELEBRATION_CLASSES = [
    "is-booking", "tier-small", "tier-mid", "tier-big", "with-rays",
    "is-podium", "podium-1", "podium-2", "podium-3",
  ];
  const PODIUM = {
    1: { medal: "🥇", kicker: "👑 Neue Nummer 1!", colors: ["#f5d76e", "#d4af37", "#fff3b0", "#f8fafc"] },
    2: { medal: "🥈", kicker: "Neu auf Platz 2!", colors: ["#e5e7eb", "#c0c0c0", "#94a3b8", "#f8fafc"] },
    3: { medal: "🥉", kicker: "Neu auf Platz 3!", colors: ["#e0a96d", "#cd7f32", "#f3c99a", "#f8fafc"] },
  };
  const HOLD_MEDAL = { 1: "🥇", 2: "🥈", 3: "🥉" };
  let celebrationQueue = [];
  let celebrationBusy = false;
  const demoMode = new URLSearchParams(window.location.search).has("demo");

  function setLetters(name, stepMs) {
    celebrationName.replaceChildren();
    Array.from(name || "").forEach((ch, idx) => {
      const span = document.createElement("span");
      span.className = "lb-letter";
      span.textContent = ch === " " ? "\u00a0" : ch;
      span.style.animationDelay = `${idx * stepMs}ms`;
      celebrationName.appendChild(span);
    });
  }

  function countUp(target, durationMs) {
    const start = performance.now();
    let shown = 0;
    const tick = (now) => {
      const progress = Math.min(1, (now - start) / durationMs);
      const eased = 1 - Math.pow(1 - progress, 3);
      const value = Math.max(1, Math.round(eased * target));
      if (value !== shown) {
        shown = value;
        amountEl.textContent = `+${value}`;
        amountEl.classList.remove("bump");
        void amountEl.offsetWidth;
        amountEl.classList.add("bump");
      }
      if (progress < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  function showNextCelebration() {
    if (celebrationBusy || celebrationQueue.length === 0) return;
    celebrationBusy = true;
    const evt = celebrationQueue.shift();
    // Stauen sich Ereignisse, laufen die Animationen schneller ab.
    const speed = celebrationQueue.length >= 2 && !demoMode ? 0.55 : 1;
    const isBooking = evt.kind === "shots_booked";

    celebrationEl.classList.remove(...CELEBRATION_CLASSES);
    celebrationSub.style.animationDelay = "";
    rankBadge.hidden = true;
    rankBadge.classList.remove("visible");

    let visibleDuration;
    if (isBooking) {
      // Gewichtung:
      //   < 5 Shots   -> kleines Banner unten
      //   5-9 Shots   -> Karte in der Mitte
      //   ab 10 Shots -> Karte wackelt, Strahlen, Konfetti
      //   aufs Podest -> Medaille, Medaillenfarbe, Glanz; Platz 1 zusätzlich Flash + Konfettiregen
      const amount = evt.amount || 1;
      const climbed = evt.rank_before && evt.rank_after && evt.rank_after < evt.rank_before;
      const podium = climbed && evt.rank_after <= 3 ? PODIUM[evt.rank_after] : null;
      let tier = amount >= 10 ? "tier-big" : amount >= 5 ? "tier-mid" : "tier-small";
      if (podium && tier === "tier-small") tier = "tier-mid"; // Podest nie als kleines Banner

      const countMs = Math.round(Math.min(600 + amount * 120, 1800) * speed);
      celebrationEl.classList.add("is-booking", tier);
      if (amount >= 10) celebrationEl.classList.add("with-rays");
      if (podium) celebrationEl.classList.add("is-podium", `podium-${evt.rank_after}`);
      celebrationEl.style.setProperty("--count-ms", `${countMs}ms`);

      const holdMedal = !climbed && evt.rank_after <= 3 ? `${HOLD_MEDAL[evt.rank_after]} ` : "";
      celebrationKicker.textContent = podium ? podium.kicker : `${holdMedal}Shots gebucht`;
      medalEl.textContent = podium ? podium.medal : "";
      setLetters(evt.team_name, podium ? 45 : 25);
      amountEl.textContent = "+0";
      celebrationSub.textContent = evt.total_shots != null ? `Total ${evt.total_shots} Shots` : "";
      celebrationSub.style.animationDelay = `${countMs}ms`;

      if (climbed && !podium) {
        rankBadge.textContent = `▲ Neu auf Platz ${evt.rank_after}!`;
        rankBadge.hidden = false;
        setTimeout(() => rankBadge.classList.add("visible"), countMs + 150);
      }
      setTimeout(() => countUp(amount, countMs), 250);

      if (podium) {
        const isFirst = evt.rank_after === 1;
        setTimeout(() => burstConfetti(isFirst ? 240 : 150, { colors: podium.colors }), 400);
        if (isFirst) setTimeout(() => burstConfetti(220, { colors: podium.colors, mode: "rain" }), 900);
      } else if (amount >= 10) {
        setTimeout(() => burstConfetti(Math.min(80 + amount * 6, 200)), 250 + countMs);
      }

      const baseDuration = { "tier-small": 2600, "tier-mid": 3600, "tier-big": 4500 }[tier];
      const podiumDuration = podium ? (evt.rank_after === 1 ? 6800 : 5600) : 0;
      visibleDuration = Math.max(baseDuration, podiumDuration, climbed ? 4200 : 0) * speed;
    } else {
      const isNew = evt.kind === "team_created";
      if (isNew) celebrationEl.classList.add("with-rays");
      medalEl.textContent = "";
      celebrationKicker.textContent = isNew ? "Neues Team" : "Willkommen";
      const letterStep = 55;
      setLetters(evt.team_name, letterStep);
      celebrationSub.textContent = isNew ? "Neu im Rennen!" : "Ist am Start!";
      const lettersMs = Array.from(evt.team_name || "").length * letterStep + 300;
      celebrationSub.style.animationDelay = `${lettersMs}ms`;
      setTimeout(() => burstConfetti(isNew ? 180 : 90), 200);
      visibleDuration = Math.max(isNew ? 4500 : 3800, lettersMs + 2200) * speed;
    }

    celebrationEl.classList.remove("hide");
    celebrationEl.classList.add("show");

    setTimeout(() => {
      celebrationEl.classList.add("hide");
      setTimeout(async () => {
        celebrationEl.classList.remove("show", "hide");
        await fetchAndRender();
        if (evt.team_id) flashTeamRow(evt.team_id);
        celebrationBusy = false;
        showNextCelebration();
      }, 400);
    }, visibleDuration);
  }

  const fetchNewEvents = async () => {
    try {
      const res = await fetch(`${eventsUrl}?after_id=${lastEventId}`, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const newEvents = data.events || [];
      newEvents.forEach((evt) => {
        lastEventId = Math.max(lastEventId, evt.id);
        celebrationQueue.push(evt);
      });
      if (newEvents.length) showNextCelebration();
    } catch (err) {
      console.error("Leaderboard-Events Refresh fehlgeschlagen", err);
    }
  };

  // Vorschau aller Animationen ohne echte Buchungen: /shotcounter/leaderboard?demo=1
  if (demoMode) {
    celebrationQueue.push(
      { kind: "team_created", team_name: "Demo Neues Team" },
      { kind: "team_arrived", team_name: "Demo Bekanntes Team" },
      { kind: "shots_booked", team_name: "Demo Klein", amount: 2, total_shots: 14, rank_before: 9, rank_after: 9 },
      { kind: "shots_booked", team_name: "Demo Aufsteiger", amount: 3, total_shots: 21, rank_before: 9, rank_after: 6 },
      { kind: "shots_booked", team_name: "Demo Mittel", amount: 7, total_shots: 30, rank_before: 5, rank_after: 5 },
      { kind: "shots_booked", team_name: "Demo Gross", amount: 15, total_shots: 48, rank_before: 6, rank_after: 4 },
      { kind: "shots_booked", team_name: "Demo Bronze", amount: 4, total_shots: 52, rank_before: 4, rank_after: 3 },
      { kind: "shots_booked", team_name: "Demo Silber", amount: 6, total_shots: 60, rank_before: 3, rank_after: 2 },
      { kind: "shots_booked", team_name: "Demo Leader", amount: 3, total_shots: 70, rank_before: 1, rank_after: 1 },
      { kind: "shots_booked", team_name: "Demo Neue Nummer 1", amount: 12, total_shots: 82, rank_before: 2, rank_after: 1 },
    );
    showNextCelebration();
  }

  fetchNewEvents();
  setInterval(fetchNewEvents, 1500);
</script>
{% endblock %}
